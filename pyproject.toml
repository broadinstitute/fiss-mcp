[project]
name = "terra-mcp"
version = "2.0.0"
description = "MCP server for interacting with Terra.Bio workspaces via FISS API"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Terra MCP Contributors"}
]
keywords = ["mcp", "terra", "firecloud", "fiss", "genomics", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=3.0.0b1",  # Skills require 3.x; using beta until stable release
    "firecloud>=0.16.39",
    # Retry.with_timeout, used to bound the GCS backend probe, is api-core >= 2.3;
    # google-cloud-storage's own floor can resolve to something older.
    "google-api-core>=2.3.0",
    "google-auth>=2.0.0",  # token minting for the GCS XML backend
    "google-cloud-batch>=0.17.0",
    "google-cloud-storage>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.25.0",  # GCS XML API backend
    # httpx (used by fastmcp) builds a transport for every proxy in the
    # environment when a client is created, and raises ImportError without this
    # package if any of them is a socks:// URL. Claude Science's sandbox sets
    # ALL_PROXY=socks5h://..., so the server cannot start there without it.
    "socksio>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff==0.16.5",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
